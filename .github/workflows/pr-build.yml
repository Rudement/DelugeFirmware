name: Pull Request Build

on:
  push:
    branches:
      - 'synthstrom-official'
      # This fork's working branch. Upstream's triggers only name upstream's branches, so
      # pushes to chopin built nothing until this line existed. Add sibling branches here as
      # needed - chopin-to-13, midi-fx - one entry each.
      - 'chopin'
  pull_request:
    branches:
      - 'community'
      - 'release/**'
  merge_group:
  workflow_dispatch:

jobs:
  release-build:
    name: Build check - Release
    uses: ./.github/workflows/build.yml
    with:
      firmware-retention-days: 5
      build-type: 'Release'
  debug-build:
    name: Build check - Debug
    uses: ./.github/workflows/build.yml
    with:
      firmware-retention-days: 5
      build-type: 'Debug'
